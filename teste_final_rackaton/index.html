<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>rackaton</title>
</head>
<body>
    <div class="container">
        <h1>Desafio Hackathon - Quiz Interativo</h1>
        <p>Jogador atual: <span id="jogador-nome-display"></span></p>

        <div id="start-screen" class="screen" style="display: block;">
            <h2>Bem-vindo(a) ao Quiz!</h2>
            <label for="nome-jogador">Digite seu nome para começar:</label>
            <input type="text" id="nome-jogador" placeholder="Seu nome" style="padding: 10px; width: 100%; margin: 10px 0;">
            <div class="btn-center">
            <button class="btn" onclick="iniciarQuiz()">Começar o Jogo</button>
            </div>
        </div>

        <div id="quiz-screen" class="screen">
            <div id="placar">
                <span>Acertos: <span id="placar-acertos">0</span></span>
                <span>Erros: <span id="placar-erros">0</span></span>
                <span id="progresso-quiz">Pergunta 0 de 5</span>
            </div>
            
            <h3 id="pergunta-texto">Carregando pergunta...</h3>
            <div id="alternativas-container">
                </div>
            <p id="feedback-animado" class="feedback"></p>
        </div>

        <div id="final-screen" class="screen">
            <h2>Fim do Jogo!</h2>
            <p>Sua pontuação final: <span id="score-final"></span> acertos.</p>
            
            <h3>Ranking Global:</h3>
            <ol id="leaderboard-list">
                </ol>
            
            <div class="end-btn">
            <button class="btn-end" onclick="reiniciarQuiz()">Jogar Novamente</button>
            </div>
        </div>
    </div>


    <script src="index.js"></script>
</body>
</html>
