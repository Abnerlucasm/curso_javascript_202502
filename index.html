<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Desafio Hackathon - Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Quiz</h1>

<div class="container">
  <div id="divNomeJogador">
    <label for="inputNomeJogador">Digite seu Nome:</label>
    <input type="text" id="inputNomeJogador" placeholder="Seu nome">
    <button id="botaoIniciar">Iniciar Quiz</button>
  </div>

  <div id="divQuiz" class="oculto">
    <div id="containerPergunta"></div>
    <div id="containerRespostas"></div>
    <button id="botaoProxima" class="oculto">Próxima</button>
    <p id="displayPontuacao"></p>
  </div>

  <div id="divLeaderboard">
    <h2>🏅 Leaderboard</h2>
    <ol id="listaLeaderboard"></ol>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
