<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hackathon Quiz — Kelvyn Martins</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Hackathon Quiz — Kelvyn Martins</h1>
      <p class="muted">Conectado ao proxy local — usando API de perguntas e respostas</p>
    </header>

    <section id="start-section" class="card">
      <h2>Iniciar</h2>
      <input id="player-name" placeholder="Digite seu nome" />
      <div style="margin-top:10px">
        <button id="btn-start">Iniciar Quiz</button>
      </div>
      <p id="start-msg" class="muted"></p>
    </section>

    <section id="quiz-container" class="card hidden">
      <div class="meta">
        <span id="progress">Pergunta 0 de 0</span>
        <span id="timer">Tempo: 0s</span>
      </div>
      <h3 id="question-text">Pergunta</h3>
      <div id="answers" class="answers"></div>
      <div style="margin-top:12px">
        <button id="btn-next" class="hidden">Próxima</button>
      </div>
    </section>

    <section id="result-section" class="card hidden">
      <h2 id="score-title"></h2>
      <p id="score"></p>
      <button id="btn-replay">Jogar Novamente</button>
    </section>

    <section id="leaderboard-section" class="card">
      <h2>Leaderboard</h2>
      <ul id="leaderboard"></ul>
    </section>
  </main>

  <script src="quiz.js"></script>
</body>
</html>
