<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Quiz Hackathon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Quiz Hackathon</h1>
    <div id="playerForm">
        <input type="text" id="playerName" placeholder="Digite seu nome">
        <button onclick="startQuiz()">Iniciar Quiz</button>
    </div>

    <div id="quizContainer"></div>
    <div id="scoreBoard"></div>

    <div id="leaderboardHeader">
        <h2>Leaderboard</h2>
        <button onclick="clearLeaderboard()" id="clearBtn">Limpar</button>
    </div>
    <ul id="leaderboard"></ul>

    <script src="script.js"></script>
</body>
</html>
