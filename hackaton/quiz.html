<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Desafio Hackathon — Quiz</title>
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    <header>
        <h1>Quiz Interativo</h1>
        <div id="score-panel">
            <div id="score">Acertos: 0 | Erros: 0</div>
            <div id="progress">Pergunta 0 de 5</div>
        </div>
    </header>

    <main>
        <section id="player-setup">
            <label for="playerName">Nome do jogador:</label>
            <input id="playerName" type="text" placeholder="Seu nome" autofocus required />
            <button id="startBtn" class="btn" type="button">Começar</button>
            <p id="welcome" class="hidden" role="status" aria-live="polite" aria-atomic="true"></p>
        </section>

        <section id="quiz" class="hidden" aria-live="polite">
            <div id="meta">
                <span id="timer">Tempo: --</span>
                <button id="helpBtn" class="btn">Ajuda (eliminar 2)</button>
            </div>

            <article id="question-card">
                <h2 id="questionText">Pergunta</h2>
                <div id="choices"></div>
            </article>

            <div id="controls">
                <button id="nextBtn" class="btn hidden" type="button">Próxima</button>
            </div>
        </section>

        <section id="result" class="hidden">
            <h2>Resultado</h2>
            <p id="finalScore">Você acertou X de 5</p>
             <button id="playAgainBtn" class="btn" type="button">Jogar novamente</button>
        </section>

        <aside id="leaderboard-section">
            <h3>Leaderboard</h3>
            <ol id="leaderboard"></ol>
        </aside>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
